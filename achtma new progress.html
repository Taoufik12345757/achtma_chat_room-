<div id="achtma-root"></div>
<style>
  #achtma-root, #achtma-root * { box-sizing: border-box; }
  #achtma-root {
    --red-deep: #7A1220;
    --red-main: #C81E3A;
    --red-bright: #E63950;
    --bubble-mine: #FADCE0;
    --bubble-theirs: #FFFFFF;
    --paper: #F3E9E6;
    --ink: #3A1418;
    --ink-soft: #8A5A5F;
    --line: #E6D2CE;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    height: 640px;
    max-height: 82vh;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px -20px rgba(122,18,32,0.45);

    flex-direction: column;

    font-family: Georgia, 'Times New Roman', serif;

  .achtma-login input {

  /* ---------- CHAT SCREEN ---------- */

  .achtma-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;

  .achtma-bubble-wrap { display: flex; margin: 3px 4px; }

  .achtma-bubble img.achtma-photo {

  .achtma-bubble-wrap .achtma-sticker-bubble {
    background: transparent !important;

  .achtma-bubble-wrap .achtma-sticker-bubble .achtma-time { text-align: inherit; font-size: 10px; margin-top: 2px; }

  .achtma-inputbar {
    display: flex;

    gap: 6px;

  }
  .achtma-icon-btn {

  .achtma-sticker-panel {

  .achtma-sticker-heading {

  .achtma-sticker-grid {

  .achtma-sticker-panel button.achtma-tiger-btn {

  .achtma-sticker-panel button.achtma-tiger-btn:hover { background: var(--paper); }
  .achtma-sticker-panel button.achtma-tiger-btn svg { width: 34px; height: 34px; }
  .achtma-sticker-panel button {
    border: none;

  }

  .achtma-upload-note {

  .achtma-inputbar input {

  .achtma-send {

  .achtma-send:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (prefers-reduced-motion: no-preference) {
    .achtma-bubble-wrap { animation: achtma-pop 0.18s ease-out; }
  }
  @keyframes achtma-pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
(function () {
  const root = document.getElementById('achtma-root');
  let state = {
    screen: 'login',
    name: '',
    room: '',
    error: '',
    messages: [],
    joining: false,
  };
  let pollTimer = null;

  function randomRoom() {
    const words = ['ember','cedar','ruby','clove','maple','coral','amber','plum','flint','rosewood'];
    const w = words[Math.floor(Math.random() * words.length)];
    const n = Math.floor(100 + Math.random() * 900);
    return w + n;
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function timeStr(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ---------- Voice / video calling (WebRTC, signaled through shared storage) ----------
  const RTC_CONFIG = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ] };
  let callState = { active: false };

  function callDocKey(room) { return storageKey(room) + ':call'; }

  async function saveCallDoc(room, doc) {
    try { await window.storage.set(callDocKey(room), JSON.stringify(doc), true); } catch (e) {}
  }
  async function loadCallDoc(room) {
    try {
      const res = await window.storage.get(callDocKey(room), true);
      return res && res.value ? JSON.parse(res.value) : null;
    } catch (e) { return null; }
  }

  function waitForIceGatheringComplete(pc, timeoutMs) {
    return new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') { resolve(); return; }
      const check = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', check);
          resolve();
        }
      };
      pc.addEventListener('icegatheringstatechange', check);
      setTimeout(() => { pc.removeEventListener('icegatheringstatechange', check); resolve(); }, timeoutMs);
    });
  }

  function attachConnectionMonitoring(pc) {
    pc.oniceconnectionstatechange = () => {
      if (callState.pc !== pc) return;
      const s = pc.iceConnectionState;
      if ((s === 'connected' || s === 'completed') && callState.status !== 'active') {
        callState.status = 'active';
        renderCallOverlay();
      } else if (s === 'failed' || s === 'disconnected' || s === 'closed') {
        if (callState.active) {
          showStatus('Call could not connect. This usually happens when both people are on different networks and there is no relay server available — try testing with both devices on the same Wi-Fi first.');
          endCall();
        }
      }
    };
    setTimeout(() => {
      if (callState.pc === pc && callState.active && pc.iceConnectionState !== 'connected' && pc.iceConnectionState !== 'completed') {
        showStatus('Call timed out trying to connect. This is often a network/firewall limitation — try the same Wi-Fi network on both sides.');
        endCall();
      }
    }, 15000);
  }

  function teardownCall() {
    if (callState.pc) { try { callState.pc.close(); } catch (e) {} }
    if (callState.localStream) callState.localStream.getTracks().forEach(t => t.stop());
    callState = { active: false };
    removeCallOverlay();
  }

  async function startCall(mode) {
    if (callState.active || !state.room) return;
    closeStickerPanel();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
    } catch (err) {
      showStatus('Could not access your ' + (mode === 'video' ? 'camera/microphone' : 'microphone') + '. Check permissions.');
      return;
    }
    const pc = new RTCPeerConnection(RTC_CONFIG);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    const remoteStream = new MediaStream();
    pc.ontrack = e => { remoteStream.addTrack(e.track); updateCallMedia(); };
    callState = {
      active: true, role: 'caller', mode, pc, localStream: stream, remoteStream,
      remoteSet: false, status: 'calling', callId: Date.now() + '-' + Math.random().toString(36).slice(2, 6)
    };
    attachConnectionMonitoring(pc);
    renderCallOverlay();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGatheringComplete(pc, 4000);
    await saveCallDoc(state.room, {
      callId: callState.callId, mode, caller: state.name, status: 'ringing',
      offer: pc.localDescription, ts: Date.now()
    });
    if (!callState.active) return;
    callState.status = 'ringing';
    renderCallOverlay();
  }

  async function acceptCall() {
    const doc = state.pendingCall;
    if (!doc) return;
    state.pendingCall = null;
    removeIncomingBanner();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: doc.mode === 'video' });
    } catch (err) {
      showStatus('Could not access your ' + (doc.mode === 'video' ? 'camera/microphone' : 'microphone') + '.');
      await saveCallDoc(state.room, Object.assign({}, doc, { status: 'declined' }));
      return;
    }
    const pc = new RTCPeerConnection(RTC_CONFIG);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    const remoteStream = new MediaStream();
    pc.ontrack = e => { remoteStream.addTrack(e.track); updateCallMedia(); };
    callState = {
      active: true, role: 'callee', mode: doc.mode, pc, localStream: stream, remoteStream,
      status: 'active', callId: doc.callId
    };
    attachConnectionMonitoring(pc);
    renderCallOverlay();
    await pc.setRemoteDescription(doc.offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForIceGatheringComplete(pc, 4000);
    if (!callState.active) return;
    await saveCallDoc(state.room, Object.assign({}, doc, { status: 'active', answer: pc.localDescription }));
  }

  async function declineCall() {
    const doc = state.pendingCall;
    state.pendingCall = null;
    removeIncomingBanner();
    if (doc) await saveCallDoc(state.room, Object.assign({}, doc, { status: 'declined' }));
  }

  async function endCall() {
    const cid = callState.callId;
    const room = state.room;
    teardownCall();
    if (!room) return;
    const doc = await loadCallDoc(room);
    if (doc && doc.callId === cid && doc.status !== 'ended') {
      await saveCallDoc(room, Object.assign({}, doc, { status: 'ended' }));
    }
  }

  async function handleCallDocUpdate(doc) {
    if (!doc) return;
    if (callState.active && callState.callId === doc.callId) {
      if (callState.role === 'caller' && doc.status === 'active' && !callState.remoteSet && doc.answer) {
        callState.remoteSet = true;
        await callState.pc.setRemoteDescription(doc.answer);
        callState.status = 'active';
        renderCallOverlay();
        return;
      }
      if (doc.status === 'declined') {
        showStatus('Call declined.');
        teardownCall();
        return;
      }
      if (doc.status === 'ended') {
        teardownCall();
        return;
      }
      return;
    }
    if (!callState.active && doc.status === 'ringing' && doc.caller !== state.name) {
      if (!state.pendingCall || state.pendingCall.callId !== doc.callId) {
        state.pendingCall = doc;
        showIncomingBanner(doc);
      }
      return;
    }
    if (state.pendingCall && state.pendingCall.callId === doc.callId && doc.status !== 'ringing') {
      state.pendingCall = null;
      removeIncomingBanner();
    }
  }

  function updateCallMedia() {
    const localEl = root.querySelector('#achtma-local-media');
    const remoteEl = root.querySelector('#achtma-remote-media');
    if (localEl && callState.localStream) localEl.srcObject = callState.localStream;
    if (remoteEl && callState.remoteStream) remoteEl.srcObject = callState.remoteStream;
  }

  function renderCallOverlay() {
    removeCallOverlay();
    if (!callState.active) return;
    const overlay = document.createElement('div');
    overlay.id = 'achtma-call-overlay';
    overlay.className = 'achtma-call-overlay';
    const label = callState.status === 'calling' ? 'Calling…' : callState.status === 'ringing' ? 'Ringing…' : 'Connected';
    const mediaHtml = callState.mode === 'video'
      ? '<div class="achtma-video-wrap"><video id="achtma-remote-media" autoplay playsinline></video><video id="achtma-local-media" autoplay playsinline muted class="achtma-local-pip"></video></div>'
      : '<div class="achtma-audio-call-avatar">📞</div><audio id="achtma-remote-media" autoplay></audio><audio id="achtma-local-media" autoplay muted style="display:none"></audio>';
    overlay.innerHTML = mediaHtml +
      '<div class="achtma-call-label">' + (callState.mode === 'video' ? 'Video call — ' : 'Voice call — ') + label + '</div>' +
      '<button id="achtma-end-call-btn" class="achtma-end-call-btn">End call</button>';
    root.appendChild(overlay);
    root.querySelector('#achtma-end-call-btn').addEventListener('click', endCall);
    updateCallMedia();
  }
  function removeCallOverlay() {

  const TIGER_IDS = ['happy','laugh','love','angry','sad','surprised','wink','cool','sleepy','party','thumbsup','kiss'];

  function tigerSVG(id, px) {
    const parts = TIGER_EXPR[id] || TIGER_EXPR.happy;
    return '<svg viewBox="0 0 100 100" width="' + px + '" height="' + px + '" xmlns="http://www.w3.org/2000/svg">' + TIGER_HEAD + parts + '</svg>';
  }
  const MAX_ROOM_BYTES = 4 * 1024 * 1024; // stay safely under the 5MB per-key storage limit

  function roughByteSize(obj) {
    return new Blob([JSON.stringify(obj)]).size;
  }

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = () => reject(new Error('read failed'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image decode failed'));
      reader.readAsDataURL(file);
    });
  }

  async function loadMessages(room) {
    try {
      const res = await window.storage.get(storageKey(room), true);
      if (res && res.value) {
        return JSON.parse(res.value);
      }
      return [];
    } catch (e) {
      return [];
    }
  }

  async function saveMessages(room, messages) {
    try {
      await window.storage.set(storageKey(room), JSON.stringify(messages), true);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function joinRoom() {
    const nameInput = root.querySelector('#achtma-name');
    const roomInput = root.querySelector('#achtma-room');
    const name = nameInput.value.trim();
    let room = roomInput.value.trim();
    if (!name) { state.error = 'Enter your name to continue.'; render(); return; }
    if (!room) { room = randomRoom(); }
    state.name = name;
    state.room = room;
    state.joining = true;
    state.error = '';
    render();
    state.messages = await loadMessages(room);
    state.joining = false;
    state.screen = 'chat';
    render();
    startPolling();
  }

  function leaveRoom() {
    stopPolling();
    if (callState.active) endCall();
    state.pendingCall = null;
    state = { screen: 'login', name: state.name, room: '', error: '', messages: [], joining: false };
    render();
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(async () => {
      if (state.screen !== 'chat') return;
      const fresh = await loadMessages(state.room);
      if (fresh.length !== state.messages.length) {
        state.messages = fresh;
        renderMessages(true);
      }
      const callDoc = await loadCallDoc(state.room);
      handleCallDocUpdate(callDoc);
    }, 2500);
  }
  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  async function pushMessage(partial) {
    const msg = Object.assign(
      { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), user: state.name, ts: Date.now() },
      partial
    );
    const current = await loadMessages(state.room);
    const projected = current.concat([msg]);
    if (roughByteSize(projected) > MAX_ROOM_BYTES) {
      showStatus('This room is full of photos — ask your friend to clear some space, or start a new room code.');
      return false;
    }
    current.push(msg);
    state.messages = current;
    renderMessages(true);
    const ok = await saveMessages(state.room, current);
    if (!ok) showStatus('Could not send — check your connection and try again.');
    return ok;
  }

  function showStatus(text, persist) {
    const el = root.querySelector('#achtma-status');
    if (!el) return;
    el.textContent = text;
    clearTimeout(showStatus._t);
    if (!persist) {
      showStatus._t = setTimeout(() => { if (el) el.textContent = 'Syncs automatically every few seconds'; }, 4000);
    }
  }

  async function sendMessage() {
    const input = root.querySelector('#achtma-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await pushMessage({ type: 'text', text });
  }

  async function sendSticker(kind, value) {
    closeStickerPanel();
    await pushMessage({ type: 'sticker', kind, value });
  }

  async function handlePhotoPick(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) { showStatus('Only photos are supported for now, not videos.'); return; }
    showStatus('Compressing photo…');
    try {
      const dataUrl = await compressImage(file, 700, 0.65);
      let sizeOk = roughByteSize({ dataUrl }) < 900 * 1024;
      let finalUrl = dataUrl;
      if (!sizeOk) {
        finalUrl = await compressImage(file, 420, 0.5);
      }
      await pushMessage({ type: 'image', dataUrl: finalUrl });
    } catch (err) {
      showStatus('Could not send that photo — try a different one.');
    }
  }

  let recorder = null;
  let recordedChunks = [];
  let recordTimer = null;
  let recordSeconds = 0;
  const MAX_RECORD_SECONDS = 60;

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('read failed'));
      reader.readAsDataURL(blob);
    });
  }

  async function toggleRecording() {
    const btn = root.querySelector('#achtma-mic-btn');
    if (recorder && recorder.state === 'recording') {
      recorder.stop();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      showStatus('Voice messages need microphone access, which this browser tab does not support.');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      showStatus('Microphone access was blocked. Allow it in your browser, or open the published link directly.');
      return;
    }
    recordedChunks = [];
    try {
      recorder = new MediaRecorder(stream);
    } catch (err) {
      showStatus('This browser cannot record audio.');
      stream.getTracks().forEach(t => t.stop());
      return;
    }
    recorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimer);
      if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
      showStatus('Syncs automatically every few seconds');
      const blob = new Blob(recordedChunks, { type: recorder.mimeType || 'audio/webm' });
      if (blob.size < 500) return; // too short / accidental tap
      try {
        const dataUrl = await blobToDataUrl(blob);
        await pushMessage({ type: 'audio', dataUrl, seconds: recordSeconds });
      } catch (err) {
        showStatus('Could not send that voice message.');
      }
      recorder = null;
    };
    recorder.start();
    recordSeconds = 0;
    if (btn) btn.classList.add('recording');
    showStatus('Recording… 0:00');
    recordTimer = setInterval(() => {
      recordSeconds += 1;
      showStatus('Recording… 0:' + String(recordSeconds).padStart(2, '0'), true);
      if (recordSeconds >= MAX_RECORD_SECONDS && recorder && recorder.state === 'recording') {
        recorder.stop();
      }
    }, 1000);
  }

  function toggleStickerPanel() {
    const existing = root.querySelector('#achtma-sticker-panel');
    if (existing) { closeStickerPanel(); return; }

  function renderMessages(scroll) {
    const wrap = root.querySelector('#achtma-messages');
    if (!wrap) return;
    if (state.messages.length === 0) {
      wrap.innerHTML = '<div class="achtma-empty">No messages yet in <strong>' + escapeHtml(state.room) + '</strong>.<br>Send the first one, and share this room code with your friend so they can join too.</div>';
      return;
    }
    wrap.innerHTML = state.messages.map(m => {
      const mine = m.user === state.name;
      const senderTag = mine ? '' : '<div class="achtma-sender">' + escapeHtml(m.user) + '</div>';
      let inner;
      let bubbleClass = 'achtma-bubble';
      if (m.type === 'image') {
        bubbleClass += ' achtma-media';
        inner = senderTag +
          '<img class="achtma-photo" src="' + m.dataUrl + '" alt="photo shared in chat" />' +
          '<div class="achtma-time">' + timeStr(m.ts) + '</div>';
      } else if (m.type === 'audio') {
        bubbleClass += ' achtma-media';
        inner = senderTag +
          '<audio class="achtma-voice" controls src="' + m.dataUrl + '"></audio>' +
          '<div class="achtma-time">' + timeStr(m.ts) + '</div>';
      } else if (m.type === 'sticker') {
        bubbleClass += ' achtma-sticker-bubble';
        const isTiger = m.kind === 'tiger';
        const content = isTiger ? tigerSVG(m.value, 64) : (m.value || m.emoji || '');
        inner = senderTag +
          '<div>' + content + '</div>' +
          '<div class="achtma-time">' + timeStr(m.ts) + '</div>';
      } else {
        inner = senderTag + escapeHtml(m.text || '') + '<div class="achtma-time">' + timeStr(m.ts) + '</div>';
      }
      return '<div class="achtma-bubble-wrap ' + (mine ? 'mine' : 'theirs') + '">' +
        '<div class="' + bubbleClass + '">' + inner + '</div></div>';
    }).join('');
    if (scroll) wrap.scrollTop = wrap.scrollHeight;
  }

      root.querySelector('#achtma-join-btn').addEventListener('click', joinRoom);

      });

      root.querySelector('#achtma-name').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
    } else {
      root.innerHTML =
        '<div class="achtma-chat">' +
          '<div class="achtma-header">' +
            '<div class="achtma-avatar">A</div>' +
            '<div class="achtma-header-info">' +
              '<div class="name">Achtma — ' + escapeHtml(state.room) + '</div>' +

            '<input type="file" id="achtma-file-input" accept="image/*" style="display:none" />' +
            '<button class="achtma-icon-btn" id="achtma-sticker-btn" title="Stickers" aria-label="Stickers">😊</button>' +
            '<button class="achtma-icon-btn" id="achtma-mic-btn" title="Record a voice message" aria-label="Record a voice message">🎤</button>' +
            '<input id="achtma-input" placeholder="Type a message" maxlength="500" />' +
            '<button class="achtma-send" id="achtma-send-btn" aria-label="Send">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 20L21 12L3 4V10L15 12L3 14V20Z" fill="white"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="achtma-status" id="achtma-status">Syncs automatically every few seconds</div>' +
        '</div>';

      renderMessages(true);
      root.querySelector('#achtma-leave-btn').addEventListener('click', leaveRoom);
      root.querySelector('#achtma-send-btn').addEventListener('click', sendMessage);
      root.querySelector('#achtma-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
      root.querySelector('#achtma-attach-btn').addEventListener('click', () => root.querySelector('#achtma-file-input').click());
      root.querySelector('#achtma-file-input').addEventListener('change', handlePhotoPick);
      root.querySelector('#achtma-sticker-btn').addEventListener('click', toggleStickerPanel);
      root.querySelector('#achtma-mic-btn').addEventListener('click', toggleRecording);
      root.querySelector('#achtma-audio-call-btn').addEventListener('click', () => startCall('audio'));
      root.querySelector('#achtma-video-call-btn').addEventListener('click', () => startCall('video'));
      if (callState.active) renderCallOverlay();
      if (state.pendingCall) showIncomingBanner(state.pendingCall);
    }
  }

  render();
})();
</script>
</div>
